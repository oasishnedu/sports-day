<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 최적화: 확대 방지, 화면 꽉 차게 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>점프 Up! 꿈 Up!! 구영 명랑 운동회</title>
    <!-- 디자인(Tailwind CSS) 및 귀여운 폰트, 아이콘 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기본 폰트 적용 및 모바일 터치 하이라이트 제거, 한국어 줄바꿈 최적화 */
        body { 
            font-family: 'Jua', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all; 
        }
        
        /* 신나는 명랑 운동회 배경 (화창한 파란 하늘) */
        .bg-sports { 
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 50%, #f0f9ff 100%); 
        }
        
        /* 타이틀 강조 효과 (두꺼운 테두리와 입체 그림자) */
        .title-stroke {
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0px 4px 6px rgba(0,0,0,0.3);
        }
        
        /* 버튼 입체감 효과 (청군 느낌) */
        .btn-blue {
            background-color: #3b82f6;
            box-shadow: 0 8px 0 #1e3a8a, 0 10px 10px rgba(0,0,0,0.25);
            border: 3px solid white;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-blue:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #1e3a8a;
        }

        /* 버튼 입체감 효과 (홍군 느낌) */
        .btn-red {
            background-color: #ef4444;
            box-shadow: 0 8px 0 #7f1d1d, 0 10px 10px rgba(0,0,0,0.25);
            border: 3px solid white;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-red:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #7f1d1d;
        }
        
        /* 만국기(운동회 깃발) 장식용 */
        .bunting-rope {
            border-bottom: 2px solid white;
            position: absolute;
            top: 15px;
            width: 100%;
            z-index: 0;
        }
        .bunting {
            width: 0;
            height: 0;
            border-left: 5vw solid transparent;
            border-right: 5vw solid transparent;
            border-top: 8vw solid;
            display: inline-block;
            margin: 0 -2px;
            filter: drop-shadow(2px 2px 1px rgba(0,0,0,0.2));
        }
        .color-1 { border-top-color: #ef4444; } /* 빨강 */
        .color-2 { border-top-color: #3b82f6; } /* 파랑 */
        .color-3 { border-top-color: #facc15; } /* 노랑 */
        .color-4 { border-top-color: #22c55e; } /* 초록 */

        /* 이미지 터치 영역 (핀치 줌을 위해 브라우저 기본 동작 차단) */
        #image-container { touch-action: none; overflow: hidden; }
        #content-image { transform-origin: 0 0; }
    </style>
</head>
<body class="bg-sports text-gray-800 h-screen w-screen overflow-hidden flex flex-col">

    <!-- ========================================== -->
    <!-- 1. 홈 화면 (처음 접속 시 보이는 화면) -->
    <!-- ========================================== -->
    <div id="home-screen" class="flex flex-col items-center justify-between h-full p-4 relative w-full max-w-lg mx-auto">
        
        <!-- 반응형 만국기 장식 -->
        <div class="absolute top-0 left-0 w-full overflow-hidden flex justify-center pt-2">
            <div class="bunting-rope"></div>
            <div class="bunting color-1"></div>
            <div class="bunting color-2"></div>
            <div class="bunting color-3"></div>
            <div class="bunting color-4"></div>
            <div class="bunting color-1"></div>
            <div class="bunting color-2"></div>
            <div class="bunting color-3"></div>
            <div class="bunting color-4"></div>
            <div class="bunting color-1"></div>
        </div>

        <!-- 공유 버튼 (우측 상단 큼직하게) -->
        <button onclick="shareApp()" class="absolute top-14 right-4 bg-white p-4 rounded-full shadow-lg text-blue-500 text-2xl z-20 border-2 border-blue-200 active:bg-gray-100">
            <i class="fas fa-share-nodes"></i>
        </button>

        <!-- 타이틀 영역 (모바일에서 매우 잘 보이도록 폰트 확대) -->
        <div class="mt-20 mb-4 flex flex-col items-center z-10 w-full">
            <h2 class="text-3xl text-yellow-300 title-stroke mb-2 tracking-wide">점프 Up! 꿈 Up!!</h2>
            <h1 class="text-[2.75rem] leading-tight font-bold text-blue-800 title-stroke tracking-tight text-center w-full px-2">구영 명랑 운동회</h1>
        </div>
        
        <!-- 중앙 귀여운 캐릭터 이미지 (mix-blend-multiply 적용하여 흰 배경 투명화 효과) -->
        <div class="w-full max-w-[330px] flex-1 flex items-center justify-center mb-6 z-10">
            <img src="image_492e69.png" alt="운동회 캐릭터" class="w-full h-auto drop-shadow-2xl animate-bounce mix-blend-multiply" style="animation-duration: 2.5s;">
        </div>

        <!-- 1부, 2부 선택 버튼 (버튼 크기와 글자 크기 극대화) -->
        <div class="w-full flex flex-col gap-6 mb-8 z-10 pb-6 px-4">
            <button onclick="selectPart(1)" class="btn-blue text-white text-3xl py-6 rounded-full font-bold flex justify-center items-center gap-3">
                <i class="fas fa-flag text-yellow-300"></i> 1부 (1~3학년)
            </button>
            <button onclick="selectPart(2)" class="btn-red text-white text-3xl py-6 rounded-full font-bold flex justify-center items-center gap-3">
                <i class="fas fa-flag text-yellow-300"></i> 2부 (4~6학년)
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 2. 상세 화면 (버튼 누른 후 넘어가는 화면) -->
    <!-- ========================================== -->
    <div id="detail-screen" class="hidden flex-col h-full w-full bg-white relative max-w-2xl mx-auto shadow-2xl">
        
        <!-- 상단 헤더 영역 (현수막 느낌, 뒤로가기 버튼 큼직하게) -->
        <div class="bg-yellow-400 shadow-md z-20 px-3 py-4 flex items-center justify-between border-b-4 border-yellow-500">
            <button onclick="goBack()" class="bg-white text-gray-800 px-5 py-2 rounded-full text-xl font-bold active:bg-gray-200 shadow-md border-2 border-yellow-200">
                <i class="fas fa-chevron-left mr-1"></i> 뒤로
            </button>
            
            <div id="part-title" class="text-3xl font-bold text-gray-800 title-stroke">1부</div>
            
            <button onclick="shareApp()" class="bg-white text-blue-600 text-xl p-3 rounded-full shadow-md border-2 border-yellow-200 flex items-center justify-center active:bg-gray-200">
                <i class="fas fa-share-nodes"></i>
            </button>
        </div>

        <!-- 현재 시각 표시 (전광판 느낌, 글씨 매우 크게) -->
        <div class="bg-sky-100 py-3 flex justify-center items-center gap-3 border-b-2 border-sky-200 shadow-inner">
            <span class="text-2xl text-sky-800 font-bold"><i class="far fa-clock mr-1"></i>현재 시각</span>
            <div class="bg-white px-6 py-2 rounded-xl shadow-md border-2 border-sky-300">
                <span id="current-time" class="text-4xl font-bold text-sky-600 tracking-wider">00:00:00</span>
            </div>
        </div>

        <!-- 메뉴 탭 3개 (모바일 화면에서 글자 안 깨지게 크고 꽉 차게) -->
        <div class="flex bg-gray-100 p-2 gap-1 z-20 shadow-md">
            <button onclick="changeTab('tab-layout')" id="btn-tab-layout" class="tab-btn flex-1 py-3 px-0 text-[1.35rem] leading-tight rounded-xl font-bold bg-white shadow-md text-blue-600 border-2 border-blue-500 transition-all">
                운동장<br>배치표
            </button>
            <button onclick="changeTab('tab-schedule')" id="btn-tab-schedule" class="tab-btn flex-1 py-3 px-0 text-[1.35rem] leading-tight rounded-xl font-bold text-gray-500 border-2 border-transparent transition-all">
                프로그램<br>운영표
            </button>
            <button onclick="changeTab('tab-timetable')" id="btn-tab-timetable" class="tab-btn flex-1 py-3 px-0 text-[1.35rem] leading-tight rounded-xl font-bold text-gray-500 border-2 border-transparent transition-all">
                일과<br>운영표
            </button>
        </div>

        <!-- 사진이 보여지는 영역 (확대/축소 기능 포함) -->
        <div id="image-container" class="flex-1 bg-gray-300 relative w-full h-full">
            <!-- 이미지를 감싸는 틀 -->
            <div id="transform-wrapper" class="absolute w-full h-full flex items-center justify-center p-2">
                <img id="content-image" src="" alt="내용 이미지" class="max-w-full max-h-full object-contain pointer-events-none shadow-xl bg-white rounded-lg">
            </div>
            <!-- 확대 팁 안내문 (크게) -->
            <div class="absolute bottom-8 left-0 right-0 text-center pointer-events-none">
                <span class="bg-black bg-opacity-75 text-white px-6 py-3 rounded-full text-xl font-bold shadow-lg border-2 border-gray-600">
                    <i class="fas fa-search-plus mr-2 text-yellow-300"></i>두 손가락으로 확대
                </span>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. 앱 동작을 위한 자바스크립트 코드 -->
    <!-- ========================================== -->
    <script>
        // 변수 설정
        let currentPart = 1;
        let currentTab = 'tab-layout';

        // 💡 주의: 폴더 안에 있는 실제 파일 이름과 대소문자, 띄어쓰기까지 완벽히 똑같아야 합니다!
        const imagesData = {
            1: {
                'tab-layout': '운동장 배치도(1부).png',
                'tab-schedule': 'image_3e24b2.png',
                'tab-timetable': 'image_5a71bc.png'
            },
            2: {
                'tab-layout': '운동장 배치도(2부).png',
                'tab-schedule': 'image_3e277b.png',
                'tab-timetable': 'image_5a74a5.png'
            }
        };

        // -------------------------
        // 화면 이동 및 탭 변경 기능
        // -------------------------
        function selectPart(part) {
            currentPart = part;
            // 홈 화면 숨기고 상세 화면 보이기
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('detail-screen').classList.remove('hidden');
            document.getElementById('detail-screen').classList.add('flex');
            
            // 제목 변경
            document.getElementById('part-title').innerText = part === 1 ? '1부' : '2부';
            
            // 기본 탭을 '운동장 배치표'로 초기화
            changeTab('tab-layout');
        }

        function goBack() {
            // 상세 화면 숨기고 홈 화면 보이기
            document.getElementById('detail-screen').classList.add('hidden');
            document.getElementById('detail-screen').classList.remove('flex');
            document.getElementById('home-screen').classList.remove('hidden');
            resetZoom();
        }

        function changeTab(tabId) {
            currentTab = tabId;
            
            // 모든 탭 버튼을 회색(비활성화)으로 변경
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'shadow-md', 'text-blue-600', 'border-blue-500');
                btn.classList.add('text-gray-500', 'border-transparent');
            });
            // 선택된 탭만 파란색(활성화)으로 변경
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.remove('text-gray-500', 'border-transparent');
            activeBtn.classList.add('bg-white', 'shadow-md', 'text-blue-600', 'border-blue-500');

            // 이미지 소스 변경
            const imgElement = document.getElementById('content-image');
            imgElement.src = imagesData[currentPart][currentTab];
            
            resetZoom();
        }

        // -------------------------
        // 시계 기능
        // -------------------------
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // -------------------------
        // 공유하기 기능
        // -------------------------
        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: '구영 명랑 운동회',
                    text: '점프 Up! 꿈 Up!! 구영 명랑 운동회 일정 및 배치도를 스마트폰으로 확인하세요!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('앱 주소가 복사되었습니다! 카카오톡이나 밴드에 붙여넣기 해주세요.');
            }
        }

        // -------------------------
        // 핀치 줌 (손가락 확대/축소) & 드래그 기능 (모바일 완벽 호환)
        // -------------------------
        const container = document.getElementById('image-container');
        const img = document.getElementById('content-image');
        
        let scale = 1;
        let panning = false;
        let pointX = 0; let pointY = 0;
        let startX = 0; let startY = 0;
        let initialDistance = 0; let initialScale = 1;
        let lastTap = 0;

        function setTransform() {
            // 확대 시 화면 밖으로 이미지가 너무 많이 나가지 않도록 경계 설정
            const maxPanX = (scale - 1) * container.clientWidth;
            const maxPanY = (scale - 1) * container.clientHeight;
            
            if(pointX > maxPanX) pointX = maxPanX;
            if(pointX < -maxPanX) pointX = -maxPanX;
            if(pointY > maxPanY) pointY = maxPanY;
            if(pointY < -maxPanY) pointY = -maxPanY;

            img.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        function resetZoom() {
            scale = 1;
            pointX = 0;
            pointY = 0;
            img.style.transform = `translate(0px, 0px) scale(1)`;
        }

        function getDistance(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            
            // 더블 탭 확대/축소
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (e.touches.length === 1 && tapLength < 300 && tapLength > 0) {
                if (scale > 1) { resetZoom(); } 
                else { scale = 2.5; setTransform(); }
            }
            lastTap = currentTime;

            if (e.touches.length === 2) {
                panning = false;
                initialDistance = getDistance(e.touches);
                initialScale = scale;
            } else if (e.touches.length === 1 && scale > 1) {
                panning = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 2) {
                const currentDistance = getDistance(e.touches);
                scale = Math.min(Math.max(1, initialScale * (currentDistance / initialDistance)), 4);
                setTransform();
            } else if (e.touches.length === 1 && panning && scale > 1) {
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                setTransform();
            }
        }, { passive: false });

        container.addEventListener('touchend', () => {
            panning = false;
        });

    </script>
</body>
</html>
